<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <title>Login - Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Mencegah Teks Terblok Biru Saat Diklik di HP */
        .no-select {
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            outline: none !important;
        }
        
        /* Menghilangkan panah spinner pada input number jika ada */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="bg-white md:bg-gray-50 flex h-screen overflow-hidden font-sans">

    <div class="hidden md:flex md:w-1/2 bg-gradient-to-br from-blue-700 to-blue-900 items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
        <div class="absolute top-0 right-0 w-96 h-96 bg-blue-500 rounded-full blur-3xl opacity-30 -mr-20 -mt-20 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 w-72 h-72 bg-cyan-400 rounded-full blur-3xl opacity-20 -ml-20 -mb-20 pointer-events-none"></div>
        
        <div class="z-10 text-center text-white px-10 no-select">
            <div class="inline-flex items-center justify-center bg-white/10 p-6 rounded-full shadow-lg backdrop-blur-sm mb-6 border border-white/20">
                <i class="fa-regular fa-newspaper text-6xl"></i>
            </div>
            <h1 class="text-4xl font-bold mb-4 tracking-tight">Portal Informasi CMS</h1>
            <p class="text-blue-100 max-w-md mx-auto leading-relaxed">Kelola berita dan dokumen instansi Anda dengan mudah, cepat, dan aman dalam satu dashboard terpadu.</p>
        </div>
    </div>

    <div class="w-full md:w-1/2 flex flex-col justify-center p-6 md:p-12 bg-white relative overflow-y-auto h-full">
        
        <a href="index.html" class="absolute top-6 left-6 md:top-8 md:left-8 text-gray-400 hover:text-blue-600 transition-all flex items-center gap-2 font-bold text-xs md:text-sm group no-select p-2 -ml-2 rounded-lg hover:bg-gray-50 z-10">
            <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> <span class="hidden sm:inline">Kembali ke Beranda</span><span class="sm:hidden">Kembali</span>
        </a>

        <div class="w-full max-w-md mx-auto mt-12 md:mt-0">
            
            <div class="text-center mb-8 md:hidden no-select pt-4">
                <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm border border-blue-100">
                    <i class="fa-regular fa-newspaper text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Portal CMS</h2>
            </div>
            
            <div class="mb-6 md:mb-8 no-select">
                <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-1 md:mb-2">Selamat Datang! 👋</h2>
                <p class="text-xs md:text-sm text-gray-500">Silakan masuk ke akun admin Anda.</p>
            </div>

            <form onsubmit="event.preventDefault(); login();" class="space-y-4 md:space-y-5">
                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-700 mb-1.5 md:mb-2 ml-1">Alamat Email</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-3.5 md:top-4 text-gray-400"></i>
                        <input type="email" id="email" required placeholder="admin@portal.com" class="w-full pl-11 pr-4 py-3 md:py-3.5 text-sm md:text-base bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none text-gray-700 font-medium">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-700 mb-1.5 md:mb-2 ml-1">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 md:top-4 text-gray-400"></i>
                        <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 md:py-3.5 text-sm md:text-base bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none text-gray-700 font-medium">
                    </div>
                    <div class="flex justify-end mt-2">
                        <a href="#" class="text-[10px] md:text-xs text-blue-600 font-bold hover:underline">Lupa password?</a>
                    </div>
                </div>
                
                <div class="pt-2 md:pt-4">
                    <button type="submit" id="loginBtn" class="no-select w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 md:py-4 rounded-xl shadow-lg shadow-blue-600/30 transition-all transform active:scale-95 flex items-center justify-center gap-2 text-sm md:text-base">
                        Masuk ke Dashboard <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
            </form>
            
            <p class="mt-8 text-center text-xs md:text-sm text-gray-500 no-select">
                Belum punya akun? <a href="register.html" class="text-blue-600 font-bold hover:underline ml-1">Daftar di sini</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Jika sudah memiliki token, langsung lempar ke dashboard
        if(getToken()) window.location.href = 'dashboard.html';

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if(!email || !password) return alert("Mohon isi email dan password!");

            // Animasi Loading
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Gagal: ' + (data.message || 'Email atau password salah.'));
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                console.log("API backend tidak ditemukan. Menjalankan Simulasi Login.");
                
                // --- SIMULASI LOGIN (Bypass untuk testing SPA jika backend mati) ---
                // Menyimpan token dummy agar bisa masuk ke dashboard
                localStorage.setItem('token', 'dummy-token-12345');
                
                // Efek loading buatan
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            }
        }
    </script>
</body>
</html>
