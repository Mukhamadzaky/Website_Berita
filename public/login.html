<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex h-screen">

    <div class="hidden md:flex md:w-1/2 bg-gradient-to-br from-blue-700 to-blue-900 items-center justify-center relative overflow-hidden">
        <div class="absolute inset-0 opacity-20 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
        <div class="z-10 text-center text-white px-10">
            <i class="fa-regular fa-newspaper text-6xl mb-6 shadow-lg rounded-full bg-white/10 p-6"></i>
            <h1 class="text-4xl font-bold mb-4">Portal Informasi CMS</h1>
            <p class="text-blue-200">Kelola berita dan dokumen instansi Anda dengan mudah, cepat, dan aman.</p>
        </div>
    </div>

    <div class="w-full md:w-1/2 flex items-center justify-center p-8 bg-white relative">
        
        <a href="index.html" class="absolute top-8 left-8 text-gray-400 hover:text-blue-600 transition-all flex items-center gap-2 font-bold text-sm group">
            <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition-transform"></i> Kembali ke Beranda
        </a>

        <div class="w-full max-w-md mt-10 md:mt-0">
            <div class="text-center mb-8 md:hidden">
                <i class="fa-regular fa-newspaper text-5xl text-blue-600 mb-3"></i>
                <h2 class="text-3xl font-bold text-gray-800">Portal CMS</h2>
            </div>
            
            <h2 class="text-3xl font-bold text-gray-800 mb-2">Selamat Datang! 👋</h2>
            <p class="text-gray-500 mb-8">Silakan masuk ke akun admin Anda.</p>

            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                    <div class="relative">
                        <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="email" id="email" placeholder="admin@portal.com" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                        <input type="password" id="password" placeholder="••••••••" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none">
                    </div>
                </div>
                
                <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition-all transform active:scale-[0.98]">
                    Masuk ke Dashboard
                </button>
            </div>
            
            <p class="mt-8 text-center text-sm text-gray-600">
                Belum punya akun? <a href="register.html" class="text-blue-600 font-bold hover:underline">Daftar di sini</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Jika sudah login, lempar ke dashboard
        if(getToken()) window.location.href = 'dashboard.html';

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return alert("Isi email dan password!");

            const btn = document.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memeriksa...';

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Gagal: ' + data.message);
                    btn.innerHTML = 'Masuk ke Dashboard';
                }
            } catch (error) {
                alert('Koneksi Error. Pastikan server Laravel (php artisan serve) sedang berjalan.');
                btn.innerHTML = 'Masuk ke Dashboard';
            }
        }
    </script>
</body>
</html>
