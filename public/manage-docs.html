<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kelola Dokumen - Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans text-slate-800">

    <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-20 transition-all duration-300">
        <div class="h-20 flex items-center px-8 border-b border-slate-800">
            <h1 class="font-bold text-xl tracking-wide flex items-center gap-3">
                <div class="bg-blue-600 p-1.5 rounded-lg"><i class="fa-solid fa-cube text-white"></i></div>
                Portal<span class="text-blue-400">Admin</span>
            </h1>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="index.html" class="flex items-center px-4 py-3.5 bg-emerald-600/10 text-emerald-400 border border-emerald-600/20 hover:bg-emerald-600 hover:text-white rounded-xl transition-all group mb-8">
                <i class="fa-solid fa-globe w-6 group-hover:animate-pulse"></i> <span class="font-semibold text-sm">Beranda</span>
            </a>

            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Main Menu</p>
            <a href="dashboard.html" class="flex items-center px-4 py-3.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all">
                <i class="fa-solid fa-grid-2 w-6"></i> <span class="font-medium text-sm">Dashboard</span>
            </a>

            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-8 mb-2">Content</p>
            <a href="upload-news.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all group">
                <i class="fa-regular fa-newspaper w-6 group-hover:text-blue-400"></i> <span class="font-medium text-sm">Tulis Berita</span>
            </a>
            <a href="upload-doc.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all group">
                <i class="fa-solid fa-file-pdf w-6 group-hover:text-orange-400"></i> <span class="font-medium text-sm">Upload Dokumen</span>
            </a>

            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-8 mb-2">Manajemen Data</p>
            <a href="manage-news.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all group">
                <i class="fa-solid fa-list-check w-6 group-hover:text-blue-400"></i> <span class="font-medium text-sm">Kelola Berita</span>
            </a>
            <a href="manage-docs.html" class="flex items-center px-4 py-3 bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-900/50">
                <i class="fa-solid fa-folder-tree w-6"></i> <span class="font-medium text-sm">Kelola Dokumen</span>
            </a>

            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-8 mb-2">Admin</p>
            <a href="inbox.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all group">
                <div class="relative w-6">
                    <i class="fa-solid fa-inbox group-hover:text-yellow-400"></i>
                    <span id="badge-dot" class="absolute -top-1 right-0 w-2 h-2 bg-red-500 rounded-full hidden"></span>
                </div>
                <span class="font-medium text-sm">Inbox</span>
            </a>
            <a href="users.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all group">
                <i class="fa-solid fa-users-gear w-6 group-hover:text-purple-400"></i> <span class="font-medium text-sm">Users</span>
            </a>
        </nav>
        
        <div class="p-6 border-t border-slate-800">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-red-400 bg-red-500/10 hover:bg-red-500 hover:text-white rounded-xl transition-all font-bold text-sm">
                <i class="fa-solid fa-power-off"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50">
        
        <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-10 sticky top-0">
            <h2 class="text-xl font-bold text-slate-700">Manajemen Dokumen</h2>
            
            <div class="flex items-center gap-6">
                <a href="upload-doc.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-lg shadow-blue-600/20 flex items-center gap-2 transition-all mr-4">
                    <i class="fa-solid fa-upload"></i> Upload Baru
                </a>
                
                <div class="flex items-center gap-4 border-l border-slate-200 pl-6">
                    <div class="text-right hidden md:block">
                        <p id="admin-name" class="text-sm font-bold text-slate-700">Memuat...</p>
                        <p id="realtime-clock" class="text-xs font-mono font-bold text-blue-600 tracking-wider mt-0.5">00:00:00 WIB</p>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 p-[2px] shadow-md">
                        <div id="admin-avatar" class="w-full h-full bg-white rounded-full flex items-center justify-center font-bold text-slate-700 text-sm">
                            <i class="fa-solid fa-spinner fa-spin text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-6 py-4">Nama File</th>
                            <th class="px-6 py-4">Tipe Format</th>
                            <th class="px-6 py-4 text-center w-32">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="doc-list" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="3" class="px-6 py-8 text-center text-slate-400">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        checkAuth();
        function logout() { localStorage.removeItem('token'); window.location.href = 'login.html'; }

        // 1. FUNGSI JAM REALTIME
        function startRealtimeClock() {
            setInterval(() => {
                const now = new Date();
                const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                document.getElementById('realtime-clock').innerText = timeString + ' WIB';
            }, 1000);
        }
        startRealtimeClock();

        // 2. AMBIL DATA NAMA USER
        fetch(`${API_URL}/profile`, { headers: { 'Authorization': `Bearer ${getToken()}` } })
        .then(res => res.json())
        .then(user => {
            if(user && user.name) {
                document.getElementById('admin-name').innerText = user.name;
                document.getElementById('admin-avatar').innerText = user.name.charAt(0).toUpperCase();
            }
        });

        // 3. CEK NOTIFIKASI INBOX
        fetch(`${API_URL}/dashboard-stats`, { headers: { 'Authorization': `Bearer ${getToken()}` } })
        .then(res => res.json())
        .then(data => {
            if(data.unread_messages > 0) {
                document.getElementById('badge-dot').classList.remove('hidden');
            }
        });

        // 4. LOAD DATA DOKUMEN
        fetch(`${API_URL}/documents`)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('doc-list');
                if(data.length === 0) { list.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-slate-400">Belum ada dokumen.</td></tr>'; return; }

                list.innerHTML = data.map(item => {
                    // Beri warna badge sesuai tipe file
                    let typeClass = 'bg-slate-100 text-slate-500 border-slate-200';
                    const type = item.file_type.toLowerCase();
                    
                    if(type.includes('pdf')) typeClass = 'bg-red-50 text-red-600 border-red-200';
                    else if(type.includes('doc')) typeClass = 'bg-blue-50 text-blue-600 border-blue-200';
                    else if(type.includes('xls')) typeClass = 'bg-green-50 text-green-600 border-green-200';

                    return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 font-bold text-slate-700">${item.title}</td>
                        <td class="px-6 py-4">
                            <span class="${typeClass} px-2 py-1 rounded text-[10px] font-bold uppercase border">${item.file_type}</span>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="deleteDoc(${item.id})" class="text-red-500 bg-red-50 hover:bg-red-500 hover:text-white w-8 h-8 rounded-lg transition-all shadow-sm" title="Hapus">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `}).join('');
            });

        // 5. FUNGSI HAPUS
        async function deleteDoc(id) {
            if(!confirm("Yakin ingin menghapus dokumen ini selamanya?")) return;

            try {
                const res = await fetch(`${API_URL}/documents/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if(res.ok) {
                    alert("✅ Dokumen berhasil dihapus");
                    location.reload();
                } else {
                    alert("Gagal menghapus.");
                }
            } catch (err) { alert("Error koneksi"); }
        }
    </script>
</body>
</html>
