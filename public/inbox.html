<!DOCTYPE html>
<html lang="id">
<head>
    <title>Inbox - Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans text-slate-800">

    <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-20">
        <div class="h-20 flex items-center px-8 border-b border-slate-800">
            <h1 class="font-bold text-xl tracking-wide flex items-center gap-3">
                <div class="bg-blue-600 p-1.5 rounded-lg"><i class="fa-solid fa-cube text-white"></i></div>
                Portal<span class="text-blue-400">Admin</span>
            </h1>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="index.html" target="_blank" class="flex items-center px-4 py-3.5 bg-emerald-600/10 text-emerald-400 border border-emerald-600/20 hover:bg-emerald-600 hover:text-white rounded-xl transition-all group mb-8">
                <i class="fa-solid fa-globe w-6"></i> <span class="font-semibold text-sm">Lihat Website</span>
            </a>
            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2">Main Menu</p>
            <a href="dashboard.html" class="flex items-center px-4 py-3.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-all"><i class="fa-solid fa-grid-2 w-6"></i> <span class="font-medium text-sm">Dashboard</span></a>
            
            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-8 mb-2">Content</p>
            <a href="upload-news.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl"><i class="fa-regular fa-newspaper w-6"></i> <span class="font-medium text-sm">Berita</span></a>
            <a href="upload-doc.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl"><i class="fa-solid fa-file-pdf w-6"></i> <span class="font-medium text-sm">Dokumen</span></a>

            <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-8 mb-2">Admin</p>
            <a href="inbox.html" class="flex items-center px-4 py-3 bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-900/50">
                <i class="fa-solid fa-inbox w-6"></i> <span class="font-medium text-sm">Inbox</span>
            </a>
            <a href="users.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl"><i class="fa-solid fa-users-gear w-6"></i> <span class="font-medium text-sm">Users</span></a>
        </nav>
        <div class="p-6 border-t border-slate-800">
            <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-red-400 bg-red-500/10 hover:bg-red-500 hover:text-white rounded-xl font-bold text-sm"><i class="fa-solid fa-power-off"></i> Logout</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50">
        <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 z-10 sticky top-0">
            <h2 class="text-xl font-bold text-slate-700">Kotak Masuk</h2>
        </header>

        <div class="flex-1 overflow-y-auto p-8">
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase text-xs tracking-wider">
                        <tr>
                            <th class="px-6 py-4">Pengirim</th>
                            <th class="px-6 py-4">Pesan</th>
                            <th class="px-6 py-4 w-40 text-right">Waktu</th>
                        </tr>
                    </thead>
                    <tbody id="msg-list" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="3" class="px-6 py-10 text-center text-slate-400">Memuat pesan...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        function logout() { localStorage.removeItem('token'); window.location.href = 'login.html'; }
        
        fetch(`${API_URL}/inbox`, { headers: { 'Authorization': `Bearer ${getToken()}` } })
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('msg-list');
            if(data.length === 0) {
                list.innerHTML = '<tr><td colspan="3" class="px-6 py-10 text-center text-slate-400"><i class="fa-regular fa-envelope-open text-4xl mb-3 block"></i>Belum ada pesan masuk.</td></tr>';
                return;
            }
            list.innerHTML = data.map(item => `
                <tr class="hover:bg-blue-50/50 transition-colors group cursor-default">
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center shrink-0">
                                ${item.name.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <p class="font-bold text-slate-800 group-hover:text-blue-600">${item.name}</p>
                                <p class="text-xs text-slate-400">${item.email}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5">
                        <p class="text-slate-600 line-clamp-2">${item.message}</p>
                    </td>
                    <td class="px-6 py-5 text-right text-slate-400 text-xs font-medium">
                        ${new Date(item.created_at).toLocaleDateString('id-ID', {day: 'numeric', month: 'short'})}
                    </td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
