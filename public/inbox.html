<!DOCTYPE html>
<html lang="id">
<head>
    <title>Inbox - Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden font-sans">
    
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <h1 class="font-bold text-lg"><i class="fa-solid fa-cube text-blue-500"></i> PortalAdmin</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="dashboard.html" class="flex items-center px-4 py-3 text-slate-400 hover:text-white rounded-xl"><i class="fa-solid fa-gauge-high w-6"></i> Dashboard</a>
            <a href="inbox.html" class="flex items-center px-4 py-3 bg-blue-600 text-white rounded-xl"><i class="fa-solid fa-inbox w-6"></i> Pesan Masuk</a>
        </nav>
        <div class="p-4 border-t border-slate-800 bg-slate-950">
            <button onclick="window.location.href='dashboard.html'" class="w-full text-sm text-slate-400">Kembali ke Menu</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8 bg-gray-50/50">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Kotak Pesan Masuk</h2>
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 border-b border-gray-100 text-gray-500 font-semibold uppercase text-xs">
                    <tr>
                        <th class="px-6 py-4">Pengirim</th>
                        <th class="px-6 py-4">Pesan</th>
                        <th class="px-6 py-4 w-32">Waktu</th>
                    </tr>
                </thead>
                <tbody id="msg-list" class="text-sm divide-y divide-gray-100">
                    <tr><td colspan="3" class="px-6 py-4 text-center text-gray-400">Memuat pesan...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        fetch(`${API_URL}/inbox`, { headers: { 'Authorization': `Bearer ${getToken()}` } })
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('msg-list');
            if(data.length === 0) {
                list.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-gray-400">Belum ada pesan masuk.</td></tr>';
                return;
            }
            list.innerHTML = data.map(item => `
                <tr class="hover:bg-blue-50/50 transition-colors">
                    <td class="px-6 py-4">
                        <p class="font-bold text-gray-800">${item.name}</p>
                        <p class="text-xs text-gray-500">${item.email}</p>
                    </td>
                    <td class="px-6 py-4 text-gray-600">${item.message}</td>
                    <td class="px-6 py-4 text-gray-400 text-xs">${new Date(item.created_at).toLocaleDateString()}</td>
                </tr>
            `).join('');
        });
    </script>
</body>
</html>
