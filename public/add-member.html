<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pengurus - Portal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .no-select { user-select: none; outline: none !important; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden font-sans text-slate-800 relative">

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/60 z-30 hidden md:hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="fixed md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0 w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-40 transition-transform duration-300 ease-in-out h-full">
        <div class="h-20 flex items-center justify-between px-8 border-b border-slate-800 no-select">
            <h1 class="font-bold text-xl tracking-wide flex items-center gap-3">
                <div class="bg-blue-600 p-1.5 rounded-lg"><i class="fa-solid fa-cube text-white"></i></div>
                Portal<span class="text-blue-400">Admin</span>
            </h1>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto" id="sidebar-nav">
            <a href="index.html" target="_blank" class="nav-item flex items-center w-full px-4 py-3 bg-emerald-600/10 text-emerald-400 border border-emerald-600/20 hover:bg-emerald-600 hover:text-white rounded-xl transition-colors group mb-6 no-select cursor-pointer">
                <div class="w-8 flex items-center"><i class="fa-solid fa-globe text-lg"></i></div>
                <span class="font-semibold text-sm">Beranda</span>
            </a>
            <div class="mb-6">
                <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 no-select">Main Menu</p>
                <a href="dashboard.html" class="nav-item flex items-center w-full px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors group no-select cursor-pointer">
                    <div class="w-8 flex items-center"><i class="fa-solid fa-grid-2 text-lg group-hover:text-blue-400 transition-colors"></i></div>
                    <span class="font-medium text-sm">Dashboard</span>
                </a>
            </div>
            <div class="mb-6 space-y-1">
                <p class="px-4 text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 no-select">Database Utama</p>
                <a href="manage-news.html" class="nav-item flex items-center w-full px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors group no-select cursor-pointer">
                    <div class="w-8 flex items-center"><i class="fa-solid fa-list-check text-lg group-hover:text-blue-400 transition-colors"></i></div>
                    <span class="font-medium text-sm">Kelola Berita</span>
                </a>
                <a href="manage-docs.html" class="nav-item flex items-center w-full px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition-colors group no-select cursor-pointer">
                    <div class="w-8 flex items-center"><i class="fa-solid fa-folder-tree text-lg group-hover:text-orange-400 transition-colors"></i></div>
                    <span class="font-medium text-sm">Kelola Dokumen</span>
                </a>
                <a href="manage-members.html" class="nav-item flex items-center w-full px-4 py-3 bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-900/50 no-select cursor-pointer">
                    <div class="w-8 flex items-center"><i class="fa-solid fa-id-card-clip text-lg"></i></div>
                    <span class="font-medium text-sm">Data Pengurus</span>
                </a>
            </div>
        </nav>
        <div class="p-6 border-t border-slate-800">
            <button onclick="window.logout()" class="w-full flex items-center justify-center gap-2 px-4 py-3 text-red-400 bg-red-500/10 hover:bg-red-500 hover:text-white rounded-xl transition-colors font-bold text-sm no-select cursor-pointer">
                <i class="fa-solid fa-power-off"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-50 w-full transition-opacity duration-300" id="main-content">
        
        <header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 md:px-8 z-10 sticky top-0 w-full">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-blue-600 focus:outline-none p-2 rounded-lg bg-slate-100 transition-colors">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 class="text-xl font-bold text-slate-700">Tambah Pengurus</h2>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="manage-members.html" class="nav-item px-4 py-2 text-sm font-bold text-slate-500 hover:text-slate-800 transition-colors hidden sm:block">Batal</a>
                <button type="submit" form="memberForm" id="saveMemberBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md shadow-indigo-600/30 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-save"></i> <span class="hidden sm:inline">Simpan Data</span>
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 w-full" id="inner-content">
            <form id="memberForm" onsubmit="event.preventDefault(); window.submitMember();" class="max-w-4xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-100 p-6 md:p-10">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="md:col-span-1 flex flex-col items-center">
                        <label class="block text-sm font-bold text-slate-600 mb-4 self-start">Foto Profil</label>
                        <div class="relative w-48 h-48 border-2 border-dashed border-slate-300 rounded-full flex flex-col items-center justify-center bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 transition-colors cursor-pointer group overflow-hidden shadow-inner">
                            <input type="file" id="member_photo" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20">
                            
                            <div id="photo-placeholder" class="text-center z-10 pointer-events-none">
                                <i class="fa-solid fa-camera text-4xl text-slate-400 group-hover:text-indigo-500 mb-2 transition-colors"></i>
                                <p class="text-[10px] font-bold text-slate-500">Upload Foto</p>
                            </div>
                            
                            <img id="photo-preview" src="" class="hidden absolute inset-0 w-full h-full object-cover z-10">
                        </div>
                        <p class="text-xs text-slate-400 mt-4 text-center">Format: JPG, PNG. Maks: 2MB.</p>
                    </div>

                    <div class="md:col-span-2 space-y-5">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div class="sm:col-span-2">
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nama Lengkap <span class="text-red-500">*</span></label>
                                <input type="text" id="member_name" required placeholder="Masukkan nama lengkap..." class="w-full border border-slate-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all font-medium">
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">NIM <span class="text-red-500">*</span></label>
                                <input type="text" id="member_nim" required placeholder="Cth: 23424001" class="w-full border border-slate-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all font-mono">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Program Studi</label>
                                <input type="text" id="member_major" value="Teknik Informatika" class="w-full border border-slate-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">No. WhatsApp</label>
                                <input type="text" id="member_phone" placeholder="0812xxxxxx" class="w-full border border-slate-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all">
                            </div>
                            
                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Divisi <span class="text-red-500">*</span></label>
                                <select id="member_division" class="w-full border border-slate-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all font-semibold appearance-none">
                                    <option value="BPH">BPH (Badan Pengurus Harian)</option>
                                    <option value="Humas">Humas / PR</option>
                                    <option value="Kominfo">Kominfo</option>
                                    <option value="PSDM">PSDM</option>
                                    <option value="Advokasi">Advokasi</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Jabatan <span class="text-red-500">*</span></label>
                                <input type="text" id="member_role" required placeholder="Cth: Ketua Umum, Staff..." class="w-full border border-slate-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all">
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Status</label>
                                <select id="member_status" class="w-full border border-slate-200 px-4 py-3 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 bg-slate-50 focus:bg-white transition-all font-semibold appearance-none">
                                    <option value="Aktif">Aktif</option>
                                    <option value="Cuti">Cuti</option>
                                    <option value="Nonaktif">Nonaktif</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="admin-core.js"></script>
</body>
</html>
