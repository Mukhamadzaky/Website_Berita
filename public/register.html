<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-md w-96 border border-gray-200">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Daftar Akun</h2>
            <p class="text-sm text-gray-500 mt-1">Buat akun untuk masuk ke dashboard</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Nama Lengkap</label>
                <input type="text" id="name" placeholder="Masukkan nama Anda" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" placeholder="contoh@email.com" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button onclick="registerAccount()" class="w-full bg-blue-600 text-white font-bold p-3 rounded-lg hover:bg-blue-700 transition duration-300">
                Daftar Sekarang
            </button>
        </div>
        
        <p class="mt-6 text-center text-sm text-gray-600">
            Sudah punya akun? <a href="login.html" class="text-blue-600 font-bold hover:underline">Login di sini</a>
        </p>
    </div>

    <script src="config.js"></script>
    
    <script>
        async function registerAccount() {
            // Ambil data dari inputan
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Validasi sederhana
            if (!name || !email || !password) {
                return alert("Semua kolom (Nama, Email, Password) wajib diisi!");
            }

            if (password.length < 6) {
                return alert("Password minimal harus 6 karakter!");
            }

            try {
                // Kirim data ke API Laravel
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alert('Registrasi Berhasil! Anda akan otomatis masuk ke Dashboard.');
                    // Simpan token yang didapat dari Laravel
                    localStorage.setItem('token', data.token);
                    // Arahkan langsung ke dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    // Tampilkan pesan error dari Laravel (misal: email sudah terdaftar)
                    alert('Gagal Mendaftar: ' + (data.message || 'Email mungkin sudah digunakan.'));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Terjadi kesalahan saat menghubungi server.");
            }
        }
    </script>
</body>
</html>
